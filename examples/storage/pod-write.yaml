apiVersion: v1
kind: Pod
metadata:
  name: storage-test
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: worker-1 # Replace locally with actual worker hostname
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Kubernetes Persistent Storage Working' > /data/test.txt; sleep 3600"]
      volumeMounts:
        - name: storage
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: storage-test-pvc
